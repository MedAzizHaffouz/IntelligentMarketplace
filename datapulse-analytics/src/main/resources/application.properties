server.port=8080

# Base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:olistdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Activation de la console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration JPA / Hibernate (sans dialecte explicite pour laisser Spring Boot 3 gérer)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Chemin vers vos fichiers CSV Olist
app.data-directory=C:/Users/azizh/Downloads/archive
